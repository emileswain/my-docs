[package]
name = "my-docs"
version = "0.1.0"
description = "my-docs desktop app with a Rust file engine"
authors = ["emile.swain"]
edition = "2021"
rust-version = "1.77"

# See https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lib]
# The `_lib` suffix avoids a name collision with the `my-docs` binary on Windows.
name = "my_docs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri shell ---
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
# Persists window position/size/monitor across restarts (stops the dev-reload
# window from jumping around the screen).
tauri-plugin-window-state = "2"
# Registers the mydocs:// URL scheme for deep links into documents.
tauri-plugin-deep-link = "2"
# Ensures a single running instance and forwards a second launch's args
# (incl. deep-link URLs on Windows/Linux) to it.
tauri-plugin-single-instance = "2"

# --- serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# --- file engine ---
walkdir = "2"          # folder scanning
notify = "6"           # native filesystem watching (replaces Python watchdog)
notify-debouncer-full = "0.3"
dashmap = "6"          # concurrent in-memory cache
quick-xml = { version = "0.36", features = ["serialize"] }
pulldown-cmark = "0.12"  # markdown
sha2 = "0.10"            # note-file keys (sha256 of the document path)
glob = "0.3"             # fnmatch-style patterns for watched-files

# --- async / plumbing ---
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
anyhow = "1"
thiserror = "1"
